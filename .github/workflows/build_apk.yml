name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (Required for modern Gradle/Android builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Fetch Dependencies
      - name: Install dependencies
        run: flutter pub get
        # If your app code is inside a subfolder (e.g. tv_app), add:
        # working-directory: tv_app

      # 5. Build Release APK
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        # If your app code is inside a subfolder (e.g. tv_app), add:
        # working-directory: tv_app

      # 6. Upload Built APK as Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          # If in a subfolder like tv_app, change path to:
          # path: tv_app/build/app/outputs/flutter-apk/app-release.apk

