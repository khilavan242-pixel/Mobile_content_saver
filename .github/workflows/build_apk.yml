name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Regenerate the Android scaffold, then re-apply our custom Android files
      #    (manifest with permissions + YouTube share receiver, and its Kotlin class)
      - name: Auto-Repair Android Folders and apply custom files
        run: |
          mkdir -p /tmp/android_custom
          cp android/app/src/main/AndroidManifest.xml /tmp/android_custom/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/example/homework_companion/ShareReceiverActivity.kt /tmp/android_custom/ShareReceiverActivity.kt
          cp android/app/src/main/kotlin/com/example/homework_companion/MainActivity.kt /tmp/android_custom/MainActivity.kt
          mkdir -p /tmp/android_custom/res
          cp -r android/app/src/main/res/mipmap-* /tmp/android_custom/res/
          rm -rf android
          flutter create --platforms android .
          cp /tmp/android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/android_custom/ShareReceiverActivity.kt android/app/src/main/kotlin/com/example/homework_companion/ShareReceiverActivity.kt
          cp /tmp/android_custom/MainActivity.kt android/app/src/main/kotlin/com/example/homework_companion/MainActivity.kt
          cp -r /tmp/android_custom/res/. android/app/src/main/res/

      # 6. Fetch Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Build Release APK
      - name: Build APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --no-shrink

      # 8. Upload the split APKs:
      #    app-arm64-v8a-release.apk    -> modern phones
      #    app-armeabi-v7a-release.apk  -> Android TV / older 32-bit devices
      #    app-x86_64-release.apk       -> emulators
      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*-release.apk
