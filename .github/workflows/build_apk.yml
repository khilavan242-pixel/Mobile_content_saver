name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. THE FIX: Auto-Repair the Android Environment
      - name: Auto-Repair Android Folders
        run: |
          rm -rf android
          flutter create --platforms android .

      # 5. THE FIX: Auto-Inject Storage Permissions
      - name: Inject Android Permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      # 6. Fetch Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Build Release APK
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # 8. Upload Built APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
