name: homework_companion
description: Kodi TV playlist manager with YouTube link lists.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.0 
  path_provider: ^2.1.2
  file_picker: ^8.1.2
  android_intent_plus: ^5.0.2
  webview_flutter: ^4.10.0
  speech_to_text: ^7.0.0
  webview_flutter_android: ^4.3.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
