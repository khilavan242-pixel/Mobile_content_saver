name: homework_companion
description: A companion app to generate and save homework files.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.0 
  image_picker: ^1.0.7
  pasteboard: any
  path_provider: ^2.1.2
  file_picker: ^8.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0 # <-- THIS IS THE NEW LINE

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
