name: homework_companion
description: A companion app to generate and save homework files.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Standard Flutter icons
  cupertino_icons: ^1.0.6

  # To request mobile storage permissions
  permission_handler: ^11.3.0 
  
  # To pick images from the phone's gallery
  image_picker: ^1.0.7
  
  # To paste images directly from the mobile clipboard
  pasteboard: any
  
  # To safely find the Documents folder on Android
  path_provider: ^2.1.2

  # NEW: To allow the user to pick their custom save folder
  file_picker: any

  # NEW: To permanently remember the folder the user chose
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
