name: homework_companion
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

# THIS IS THE FIX FOR THE GITHUB ERROR:
environment:
  sdk: '^3.12.0'

# THESE ARE YOUR PERFECT DEPENDENCIES:
dependencies:
  flutter:
    sdk: flutter
  # To request mobile storage permissions
  permission_handler: ^11.3.0 
  # To pick images from the phone's gallery
  image_picker: ^1.0.7
  # To paste images directly from the mobile clipboard
  pasteboard: ^0.2.2
  # To safely find the Documents folder on Android
  path_provider: ^2.1.2
